name: Benchmarks-Light

on:
  push:
    tags:
      - 'v*'
      - 'v5.*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/CSharpEssentials.LoggerHelper.Benchmarks/CSharpEssentials.LoggerHelper.Benchmarks.csproj

      - name: Build Release
        run: dotnet build src/CSharpEssentials.LoggerHelper.Benchmarks/CSharpEssentials.LoggerHelper.Benchmarks.csproj -c Release --no-restore

      # Light: one class only (LoggerHelper vs Serilog vs NLog), short job (3 iterations).
      - name: Run benchmarks
        run: |
          dotnet run -c Release \
            --project src/CSharpEssentials.LoggerHelper.Benchmarks/CSharpEssentials.LoggerHelper.Benchmarks.csproj \
            --framework net9.0 \
            -- --filter '*ThroughputBenchmark*' --job short --artifacts ./benchmark-results

      # Results visible on the run page (Summary tab).
      - name: Write results to run summary
        if: always()
        run: |
          {
            echo "# Benchmark results"
            echo ""
            echo "Commit: \`${GITHUB_SHA::7}\` · Runtime: .NET 9 · ubuntu-latest · job short"
            echo ""
            found=0
            for f in benchmark-results/results/*-report-github.md; do
              [ -e "$f" ] || continue
              found=1
              name=$(basename "$f" -report-github.md)
              echo "## ${name##*.}"
              echo ""
              cat "$f"
              echo ""
            done
            [ "$found" = 1 ] || echo "_No results produced._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Full BenchmarkDotNet output downloadable from the run page.
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: benchmark-results
          if-no-files-found: warn
          retention-days: 30

      - name: Generate docs/benchmarks.md
        run: bash .github/scripts/generate-benchmarks-md.sh

      # main is protected: open a PR instead of pushing to main.
      # Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
      - name: Open PR with updated docs/benchmarks.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/benchmarks.md; then
            echo "docs/benchmarks.md unchanged, no PR."
            exit 0
          fi
          branch="bench/results-${{ github.run_number }}"
          git switch -c "$branch"
          git add docs/benchmarks.md
          git commit -m "chore: update benchmark results (run ${{ github.run_number }})"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update benchmark results (run ${{ github.run_number }})" \
            --body "Benchmark results from [run ${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on \`${{ github.ref_name }}\`. Tables are also in the run summary."
